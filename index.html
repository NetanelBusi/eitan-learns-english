<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#CFE9F5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Eitan English">
<title>Eitan Learns English</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#152647; --sky:#CFE9F5; --sky-deep:#A9D6EA; --card:#FFFFFF;
    --tangerine:#FF7A45; --grape:#6C4BD1; --leaf:#20B278; --sun:#FFC93C;
    --sh:5px 5px 0 var(--ink); --sh-sm:3px 3px 0 var(--ink);
    --display:'Baloo 2','Rubik',system-ui,sans-serif;
    --body:'Rubik',system-ui,sans-serif;
    --letterface:'Andika','Trebuchet MS',system-ui,sans-serif;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{overscroll-behavior:none}
  body{
    margin:0;font-family:var(--body);color:var(--ink);
    padding:calc(10px + var(--safe-t)) 10px calc(150px + var(--safe-b));
    background:var(--sky);
    background-image:radial-gradient(var(--sky-deep) 2px,transparent 2px);
    background-size:24px 24px;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  button{font-family:inherit;touch-action:manipulation}
  .wrap{max-width:860px;margin:0 auto}

  header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .logo{font-family:var(--display);font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
  .logo b{font-family:var(--letterface);font-weight:700;background:var(--sun);border:3px solid var(--ink);
    border-radius:10px;padding:0 8px;box-shadow:var(--sh-sm);transform:rotate(-4deg);display:inline-block;letter-spacing:1px}
  .steps{display:flex;gap:5px}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--card);border:3px solid var(--ink);padding:0;cursor:pointer}
  .dot.done{background:var(--leaf)}
  .dot[aria-current="true"]{background:var(--grape);transform:scale(1.3)}

  /* ---- board: always 4 letters, 2×2 on phone ---- */
  .board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .letter{
    background:var(--card);border:4px solid var(--ink);border-radius:20px;box-shadow:var(--sh);
    padding:10px 8px;text-align:center;position:relative;overflow:hidden;
  }
  .letter::after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:var(--sky);inset:auto -38px -48px auto}
  .letter>*{position:relative;z-index:1}
  .badge{position:absolute;top:6px;inset-inline-start:6px;z-index:2;font-family:var(--display);font-size:11px;
    background:var(--leaf);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 7px;display:none}
  .letter.mastered .badge{display:block}
  .letter.half .badge{display:block;background:var(--sun);color:var(--ink)}
  /* line-height חייב להשאיר מקום לזנב היורד של g j p q y,
     אחרת הזנב בורח מהקופסה והתווית "אומרים" נצבעת עליו */
  .pair{display:flex;align-items:baseline;justify-content:center;gap:8px;line-height:1}
  .up{font-family:var(--letterface);font-weight:700;font-size:clamp(44px,13vw,72px);line-height:1.05}
  .low{font-family:var(--letterface);font-weight:400;font-size:clamp(32px,9.5vw,52px);color:var(--tangerine);line-height:1.4}
  .tip{font-family:var(--display);font-size:14px;margin:6px 0 8px}
  .tip span{background:var(--sun);border:2px solid var(--ink);border-radius:7px;padding:0 8px}

  .btn{font-family:var(--display);font-weight:600;cursor:pointer;color:var(--ink);
    border:3px solid var(--ink);border-radius:13px;background:var(--card);box-shadow:var(--sh-sm);
    transition:transform .07s ease,box-shadow .07s ease}
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn:focus-visible,.dot:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
  .hear{width:100%;min-height:48px;font-size:16px;background:var(--leaf);color:#fff}
  .writes{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
  .write{width:100%;min-height:46px;font-size:14px;padding:0 4px;background:var(--grape);color:#fff}
  .write .ch{font-family:var(--letterface);font-weight:700;font-size:19px}
  .write.wdone{background:var(--leaf)}
  .write.wdone::after{content:" ✓"}
  .word{width:100%;min-height:38px;margin-top:6px;font-size:13px;background:var(--sky)}
  .word .en{font-family:var(--letterface);font-weight:700}
  .letter.speaking{background:#FFF6D9}
  .letter.hit{background:#DFF6EC}
  .letter.miss{background:#FFE6DC}

  .status{font-family:var(--display);font-size:16px;text-align:center;min-height:22px;margin:10px 0 0}

  /* ---- sticky bottom bar ---- */
  .bar{
    position:fixed;inset-inline:0;bottom:0;z-index:20;
    padding:10px 10px calc(10px + var(--safe-b));
    background:linear-gradient(to top,var(--sky) 72%,rgba(207,233,245,0));
  }
  .bar-in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:56px 1fr 1fr 56px;gap:8px}
  .bar .btn{min-height:52px;font-size:15px;padding:0 6px}
  .arrow{font-size:22px;background:var(--card)}
  .all{background:var(--sun)}
  .quiz{background:var(--grape);color:#fff}

  /* ---- writing pad: fullscreen sheet ---- */
  .pad{position:fixed;inset:0;z-index:60;background:var(--sky);display:none;
    flex-direction:column;padding:calc(8px + var(--safe-t)) 10px calc(8px + var(--safe-b));overscroll-behavior:contain}
  .pad.on{display:flex}
  .pad-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .pad-top h2{font-family:var(--display);font-size:17px;margin:0}
  .close{width:44px;height:44px;border-radius:50%;font-size:20px;background:var(--card)}
  .case{display:inline-flex;background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:3px;margin:8px auto;box-shadow:var(--sh-sm)}
  .case button{font-family:var(--letterface);font-weight:700;font-size:17px;border:0;background:transparent;color:var(--ink);
    min-height:40px;padding:0 18px;border-radius:999px;cursor:pointer}
  .case button[aria-pressed="true"]{background:var(--grape);color:#fff}
  .sheet{position:relative;width:min(94vw,52vh);aspect-ratio:1/1;margin:0 auto;flex:0 0 auto}
  .sheet canvas{position:absolute;inset:0;width:100%;height:100%;border:3px solid var(--ink);border-radius:16px;display:block}
  #guide{background:#FFFDF6}
  #ink{touch-action:none;background:transparent}
  .meter{width:min(94vw,52vh);height:12px;margin:10px auto 0;background:var(--card);border:3px solid var(--ink);border-radius:999px;overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:var(--leaf);transition:width .35s ease}
  .result{font-family:var(--display);font-size:15px;line-height:1.35;text-align:center;margin:10px auto 0;max-width:420px;flex:1 1 auto}
  .padbtns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;max-width:420px;margin:0 auto;width:100%}
  .padbtns .btn{min-height:56px;font-size:18px}
  .check{background:var(--leaf);color:#fff}
  .clear{background:var(--sun)}

  /* ---- install to home screen ---- */
  .install{display:none;align-items:center;gap:8px;margin-bottom:10px;padding:8px 10px;
    background:var(--sun);border:3px solid var(--ink);border-radius:14px;box-shadow:var(--sh-sm)}
  .install.on{display:flex}
  .install p{margin:0;flex:1 1 auto;font-family:var(--display);font-size:14px;line-height:1.25}
  .install .go{flex:0 0 auto;min-height:42px;padding:0 14px;font-size:14px;background:var(--leaf);color:#fff}
  .install .x{flex:0 0 auto;width:36px;min-height:36px;padding:0;font-size:15px;background:var(--card);border-radius:50%}

  .help{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    padding:16px;background:rgba(21,38,71,.55)}
  .help.on{display:flex}
  .help-box{width:100%;max-width:380px;padding:16px;font-family:var(--display);
    background:var(--card);border:4px solid var(--ink);border-radius:20px;box-shadow:var(--sh)}
  .help-box h3{margin:0 0 10px;font-size:18px}
  .help-box ol{margin:0 0 14px;padding-inline-start:22px;font-size:15px;line-height:1.75}
  .help-box .btn{width:100%;min-height:48px;font-size:16px;background:var(--grape);color:#fff}

  /* ---- games ---- */
  .toprow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
  .games-open{width:100%;min-height:52px;font-size:15px;padding:0 6px;background:var(--tangerine);color:#fff}
  .abc-btn{width:100%;min-height:52px;font-size:15px;padding:0 6px;background:var(--grape);color:#fff}
  .abc-btn.playing{background:var(--leaf)}

  .games{position:fixed;inset:0;z-index:70;display:none;flex-direction:column;background:var(--sky);
    padding:calc(8px + var(--safe-t)) 10px calc(10px + var(--safe-b));overflow-y:auto;overscroll-behavior:contain}
  .games.on{display:flex}
  .games-top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .games-top h2{flex:1 1 auto;margin:0;font-family:var(--display);font-size:20px}
  .chip{font-family:var(--display);font-size:16px;background:var(--sun);
    border:3px solid var(--ink);border-radius:999px;padding:4px 12px;box-shadow:var(--sh-sm)}

  .gview{display:none;flex:1 1 auto;flex-direction:column;width:100%;max-width:520px;margin:0 auto}
  .gview.on{display:flex}

  .grange{font-family:var(--display);font-size:14px;text-align:center;margin:0 0 12px;padding:5px 10px;
    background:var(--card);border:3px solid var(--ink);border-radius:999px;box-shadow:var(--sh-sm)}
  .gcard{display:grid;gap:2px;width:100%;margin-bottom:12px;padding:12px 14px;text-align:start;cursor:pointer;
    font-family:var(--display);color:var(--ink);background:var(--card);border:4px solid var(--ink);
    border-radius:18px;box-shadow:var(--sh);transition:transform .07s ease,box-shadow .07s ease}
  .gcard:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink)}
  .gcard:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
  .gicon{font-size:30px}
  .gname{font-size:19px;font-weight:800}
  .gdesc{font-family:var(--body);font-size:13px;line-height:1.35}
  .gbest{font-size:13px;margin-top:4px;color:#4A5A78}

  .gq{font-family:var(--display);font-size:16px;text-align:center;margin:0 0 10px}
  .speaker{display:block;width:112px;height:112px;margin:6px auto 8px;border-width:4px;border-radius:50%;
    font-size:44px;background:var(--leaf);color:#fff;box-shadow:var(--sh)}
  .ghint{font-family:var(--body);font-size:13px;text-align:center;margin:0 0 14px}
  .gopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .opt{min-height:74px;font-family:var(--letterface);font-weight:700;font-size:38px;background:var(--card)}
  .opt.good{background:var(--leaf);color:#fff}
  .opt.bad{background:#FFD9CC;opacity:.6}

  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .tile{min-height:66px;font-family:var(--letterface);font-weight:700;font-size:32px;cursor:pointer;
    color:var(--ink);background:var(--card);border:3px solid var(--ink);border-radius:14px;box-shadow:var(--sh-sm);
    transition:transform .07s ease,box-shadow .07s ease}
  .tile.tlow{background:#FFF4DA}
  .tile.sel{background:var(--grape);color:#fff;transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .tile.bad{background:#FFD9CC}
  .tile.done{background:var(--leaf);color:#fff;opacity:.5}
  .tile:focus-visible{outline:4px solid var(--grape);outline-offset:3px}

  /* ---- word search ---- */
  .words{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:10px}
  .wchip{font-family:var(--display);font-size:13px;padding:3px 10px;
    background:var(--card);border:3px solid var(--ink);border-radius:999px;box-shadow:var(--sh-sm)}
  .wchip .en{font-family:var(--letterface);font-weight:700;font-size:15px}
  .wchip.found{background:var(--leaf);color:#fff;text-decoration:line-through}
  .grid{display:grid;gap:4px;width:100%;max-width:420px;margin:0 auto;
    touch-action:none;-webkit-user-select:none;user-select:none}
  .cell{display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;
    font-family:var(--letterface);font-weight:700;font-size:clamp(14px,4.2vw,22px);color:var(--ink);
    background:var(--card);border:2px solid var(--ink);border-radius:8px}
  .cell.sel{background:var(--sun)}
  .cell.found{background:var(--leaf);color:#fff;border-color:var(--ink)}
  .cell.bad{background:#FFD9CC}

  .gend{justify-content:center;text-align:center;font-family:var(--display)}
  .stars{font-size:44px;margin:0 0 6px;line-height:1.1}
  .endscore{font-size:22px;margin:0 0 6px}
  .endmsg{font-size:16px;margin:0 0 18px;line-height:1.4}
  .endbtns{display:grid;gap:10px;width:100%;max-width:320px;margin:0 auto}
  .endbtns .btn{min-height:52px;font-size:17px}
  .again{background:var(--leaf);color:#fff}
  .back{background:var(--card)}

  @media (min-width:520px){ .tiles{grid-template-columns:repeat(4,1fr)} }

  @media (min-width:720px){
    .board{grid-template-columns:repeat(4,1fr)}
    .bar-in{grid-template-columns:64px 1fr 1fr 64px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><b>Aa</b> Eitan Learns English</div>
    <div class="steps" id="steps" role="group" aria-label="קבוצות אותיות"></div>
  </header>

  <div class="install" id="install">
    <p id="installText">רוצים את האפליקציה על מסך הבית?</p>
    <button class="btn go" id="installBtn">📲 התקנה</button>
    <button class="btn x" id="installX" aria-label="לא עכשיו">✕</button>
  </div>

  <div class="toprow">
    <button class="btn games-open" id="gamesOpen" type="button">🎮 משחקים וניקוד</button>
    <button class="btn abc-btn" id="abcAll" type="button">🔤 כל ה-ABC</button>
  </div>

  <main class="board" id="board"></main>
  <p class="status" id="status"></p>
</div>

<nav class="bar">
  <div class="bar-in">
    <button class="btn arrow" id="prev" aria-label="הקודמות">→</button>
    <button class="btn all" id="all">🔊 כל הארבע</button>
    <button class="btn quiz" id="quiz">🎧 מה שמעתם?</button>
    <button class="btn arrow" id="next" aria-label="הבאות">←</button>
  </div>
</nav>

<section class="pad" id="pad" aria-modal="true" role="dialog">
  <div class="pad-top">
    <h2 id="padTitle">כתיבת האות</h2>
    <button class="btn close" id="closePad" aria-label="סגירה">✕</button>
  </div>
  <div class="case" role="group" aria-label="גודל האות">
    <button id="caseUp" aria-pressed="true">A גדולה</button>
    <button id="caseLow" aria-pressed="false">a קטנה</button>
  </div>
  <div class="sheet">
    <canvas id="guide"></canvas>
    <canvas id="ink" aria-label="שטח כתיבה"></canvas>
  </div>
  <div class="meter"><i id="bar"></i></div>
  <p class="result" id="result">עוברים עם האצבע על האות האפורה, ואז לוחצים "בדקו אותי".</p>
  <div class="padbtns">
    <button class="btn clear" id="clear">🧽 מוחקים</button>
    <button class="btn check" id="check">✅ בדקו אותי</button>
  </div>
</section>

<section class="games" id="games" role="dialog" aria-modal="true" aria-labelledby="gamesTitle">
  <div class="games-top">
    <h2 id="gamesTitle">משחקים</h2>
    <div class="chip" id="scoreChip" hidden>⭐ <b id="scoreNow">0</b></div>
    <button class="btn close" id="gamesClose" type="button" aria-label="סגירה">✕</button>
  </div>

  <div class="gview on" id="gmenu">
    <p class="grange" id="grange"></p>
    <button class="gcard" id="playListen" type="button">
      <span class="gicon">🎧</span>
      <span class="gname">שומעים ובוחרים</span>
      <span class="gdesc">לוחצים על הרמקול, שומעים את שם האות, ובוחרים אותה מבין ארבע</span>
      <span class="gbest">🏆 שיא: <b id="bestListen">0</b></span>
    </button>
    <button class="gcard" id="playPairs" type="button">
      <span class="gicon">🔤</span>
      <span class="gname">גדולה וקטנה</span>
      <span class="gdesc">מתאימים כל אות גדולה לאות הקטנה שלה</span>
      <span class="gbest">🏆 שיא: <b id="bestPairs">0</b></span>
    </button>
    <button class="gcard" id="playSearch" type="button">
      <span class="gicon">🔎</span>
      <span class="gname">תפזורת אותיות</span>
      <span class="gdesc">מוצאים את המילים שמתחבאות בלוח ומעבירים עליהן את האצבע</span>
      <span class="gbest">🏆 שיא: <b id="bestSearch">0</b></span>
    </button>
  </div>

  <div class="gview" id="gSearch">
    <p class="gq" id="searchQ"></p>
    <div class="words" id="searchWords"></div>
    <div class="grid" id="searchGrid" dir="ltr"></div>
  </div>

  <div class="gview" id="gListen">
    <p class="gq" id="listenQ"></p>
    <button class="btn speaker" id="speakerBtn" type="button" aria-label="להשמיע שוב את האות">🔊</button>
    <p class="ghint">לוחצים על הרמקול, ואז בוחרים את האות ששמעתם</p>
    <div class="gopts" id="listenOpts"></div>
  </div>

  <div class="gview" id="gPairs">
    <p class="gq" id="pairsQ"></p>
    <div class="tiles" id="pairsGrid"></div>
  </div>

  <div class="gview gend" id="gEnd">
    <p class="stars" id="endStars"></p>
    <p class="endscore">הניקוד שלך: <b id="endScore">0</b></p>
    <p class="endmsg" id="endMsg"></p>
    <div class="endbtns">
      <button class="btn again" id="playAgain" type="button">🔁 עוד פעם</button>
      <button class="btn back" id="backMenu" type="button">← חזרה למשחקים</button>
    </div>
  </div>
</section>

<section class="help" id="help" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
  <div class="help-box">
    <h3 id="helpTitle">להוספת האפליקציה למסך הבית</h3>
    <ol id="helpList"></ol>
    <button class="btn" id="helpOk">הבנתי</button>
  </div>
</section>

<script>
const L=[
  {u:"A",say:"איי",w:"Apple",he:"תפוח",e:"🍎"},{u:"B",say:"בּי",w:"Ball",he:"כדור",e:"⚽"},
  {u:"C",say:"סי",w:"Cat",he:"חתול",e:"🐱"},{u:"D",say:"די",w:"Dog",he:"כלב",e:"🐶"},
  {u:"E",say:"אי",w:"Egg",he:"ביצה",e:"🥚"},{u:"F",say:"אֶף",w:"Fish",he:"דג",e:"🐟"},
  {u:"G",say:"ג'י",w:"Giraffe",he:"ג'ירפה",e:"🦒"},{u:"H",say:"אייץ'",w:"House",he:"בית",e:"🏠"},
  {u:"I",say:"איי",w:"Ice cream",he:"גלידה",e:"🍦"},{u:"J",say:"ג'יי",w:"Juice",he:"מיץ",e:"🧃"},
  {u:"K",say:"קיי",w:"Key",he:"מפתח",e:"🔑"},{u:"L",say:"אֶל",w:"Lion",he:"אריה",e:"🦁"},
  {u:"M",say:"אֶם",w:"Moon",he:"ירח",e:"🌙"},{u:"N",say:"אֶן",w:"Nose",he:"אף",e:"👃"},
  {u:"O",say:"או",w:"Orange",he:"תפוז",e:"🍊"},{u:"P",say:"פּי",w:"Pizza",he:"פיצה",e:"🍕"},
  {u:"Q",say:"קיוּ",w:"Queen",he:"מלכה",e:"👑"},{u:"R",say:"אָר",w:"Rainbow",he:"קשת",e:"🌈"},
  {u:"S",say:"אֶס",w:"Sun",he:"שמש",e:"☀️"},{u:"T",say:"טי",w:"Tree",he:"עץ",e:"🌳"},
  {u:"U",say:"יוּ",w:"Umbrella",he:"מטרייה",e:"☂️"},{u:"V",say:"וי",w:"Violin",he:"כינור",e:"🎻"},
  {u:"W",say:"דאבּל-יוּ",w:"Watch",he:"שעון",e:"⌚"},{u:"X",say:"אֶקס",w:"Fox",he:"שועל",e:"🦊"},
  {u:"Y",say:"וואי",w:"Yo-yo",he:"יו-יו",e:"🪀"},{u:"Z",say:"זי",w:"Zebra",he:"זברה",e:"🦓"}
];
/* תיקון נקודתי להגייה של אות מסוימת, אם מנוע ההקראה טועה בה.
   ריק בכוונה – ברירת המחדל היא לתת למנוע את התו עצמו, כי יש לו
   טיפול מובנה בשמות אותיות שעדיף על כל איות פונטי שננחש. */
const SAY_AS={};
const groups=[]; for(let i=0;i<L.length;i+=4) groups.push(L.slice(i,i+4));
const $=id=>document.getElementById(id);
let g=0,quizAnswer=null,visited=new Set([0]),mastered={},padLetter=null,padCase="up";

/* ---- speech (iOS needs one tap to unlock) ---- */
let voice=null,unlocked=false;
function pickVoice(){
  const v=speechSynthesis.getVoices().filter(x=>x.lang&&x.lang.toLowerCase().startsWith("en"));
  voice=v.find(x=>/samantha|zira|karen|google us|female/i.test(x.name))||v[0]||null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
document.addEventListener("pointerdown",()=>{
  if(unlocked||!("speechSynthesis" in window)) return;
  unlocked=true; const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); pickVoice();
},{once:true});
function speak(t,rate,onend){
  if(!("speechSynthesis" in window)){ if(onend) onend(); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang="en-US"; u.rate=rate||.7; u.pitch=1.05; if(voice) u.voice=voice; if(onend) u.onend=onend;
  speechSynthesis.speak(u);
}
/* הקראת שם האות. מעבירים למנוע את התו בקטן ולא בגדול: מנועים
   מסוימים מוסיפים "capital" לפני אות גדולה בודדת, ובאות קטנה אין
   הודעת רישיות בכלל – וההגייה היא שם האות האמיתי מהמנוע עצמו. */
function speakLetter(l,rate,onend){
  if(!l) return;
  const ch=String(l.u||"").toLowerCase();
  speak(SAY_AS[l.u]||ch,rate||.7,onend);
}
let ac;
function tone(fs){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended") ac.resume();
    fs.forEach((f,i)=>{
      const o=ac.createOscillator(),gn=ac.createGain();
      o.type="triangle";o.frequency.value=f;o.connect(gn);gn.connect(ac.destination);
      const t=ac.currentTime+i*.12;
      gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(.14,t+.02);
      gn.gain.exponentialRampToValueAtTime(.0001,t+.22);
      o.start(t);o.stop(t+.24);
    });
  }catch(e){}
}

let abcPlaying=false, abcIdx=0;

/* ---- writing pad ---- */
const S=360, FONT='700 250px Andika,"Trebuchet MS",system-ui,sans-serif';
const guide=$("guide"), ink=$("ink");
const gctx=guide.getContext("2d"), ictx=ink.getContext("2d");
const PEN=17;
/* travel = אורך המסלול שהאצבע עברה. משמש לזיהוי קישקוש: מעבר נקי
   על האות מכסה שטח שמתאים לאורך המסלול כפול עובי העט, וקישקוש
   שחוזר על עצמו עובר מסלול ארוך בהרבה מהשטח שנצבע. */
let drawing=false, strokes=0, travel=0, lastP=null;

function fitCanvas(c,ctx){
  const r=c.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,3);
  c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr);
  const k=c.width/S; ctx.setTransform(k,0,0,k,0,0);
}
function targetChar(){ return padCase==="up"?padLetter.u:padLetter.u.toLowerCase(); }
function drawLetterOn(ctx,size,style){
  ctx.save(); ctx.scale(size/S,size/S);
  ctx.font=FONT; ctx.textAlign="center"; ctx.textBaseline="alphabetic";
  ctx.fillStyle=style||"#000"; ctx.fillText(targetChar(),S/2,S*0.78);
  ctx.restore();
}
function drawGuide(){
  if(!padLetter) return;
  gctx.clearRect(0,0,S,S);
  gctx.fillStyle="#FFFDF6"; gctx.fillRect(0,0,S,S);
  const top=S*.20, mid=S*.49, base=S*.78;
  gctx.strokeStyle="#9FC7DC"; gctx.lineWidth=2;
  [top,base].forEach(y=>{ gctx.beginPath(); gctx.moveTo(14,y); gctx.lineTo(S-14,y); gctx.stroke(); });
  gctx.setLineDash([8,8]); gctx.strokeStyle="#C9DFEB";
  gctx.beginPath(); gctx.moveTo(14,mid); gctx.lineTo(S-14,mid); gctx.stroke(); gctx.setLineDash([]);
  drawLetterOn(gctx,S,"#D9DEE8");
}
function clearInk(){
  ictx.clearRect(0,0,S,S); strokes=0; travel=0; lastP=null;
  $("bar").style.width="0%"; $("bar").style.background="var(--leaf)";
  $("result").textContent='עוברים עם האצבע על האות האפורה, ואז לוחצים "בדקו אותי".';
}
function pos(e){
  const r=ink.getBoundingClientRect();
  return {x:(e.clientX-r.left)*S/r.width, y:(e.clientY-r.top)*S/r.height};
}
ink.addEventListener("pointerdown",e=>{
  e.preventDefault(); drawing=true; strokes++; ink.setPointerCapture(e.pointerId);
  const p=pos(e); lastP=p;
  ictx.strokeStyle="#152647"; ictx.lineWidth=PEN; ictx.lineCap="round"; ictx.lineJoin="round";
  ictx.beginPath(); ictx.moveTo(p.x,p.y); ictx.lineTo(p.x+.1,p.y); ictx.stroke();
});
ink.addEventListener("pointermove",e=>{
  if(!drawing) return; e.preventDefault(); const p=pos(e);
  if(lastP) travel+=Math.hypot(p.x-lastP.x,p.y-lastP.y);
  lastP=p;
  ictx.lineTo(p.x,p.y); ictx.stroke();
});
["pointerup","pointercancel","pointerleave"].forEach(ev=>ink.addEventListener(ev,()=>drawing=false));

function openPad(l,c){
  stopAbc();
  padLetter=l; padCase=(c==="low")?"low":"up";
  const isUp=padCase==="up";
  $("caseUp").setAttribute("aria-pressed",String(isUp));
  $("caseLow").setAttribute("aria-pressed",String(!isUp));
  /* התוויות חייבות להשתנות לפי האות שנבחרה, אחרת תמיד מוצג A/a */
  $("caseUp").textContent=l.u+" גדולה";
  $("caseLow").textContent=l.u.toLowerCase()+" קטנה";
  $("padTitle").textContent="כתיבת האות "+l.u+l.u.toLowerCase();
  $("pad").classList.add("on");
  requestAnimationFrame(()=>{ fitCanvas(guide,gctx); fitCanvas(ink,ictx); drawGuide(); clearInk(); });
  speakLetter(l,.65);
}
function setCase(c){
  padCase=c;
  $("caseUp").setAttribute("aria-pressed",c==="up"); $("caseLow").setAttribute("aria-pressed",c==="low");
  drawGuide(); clearInk(); speakLetter(padLetter,.65);
}
$("caseUp").onclick=()=>setCase("up");
$("caseLow").onclick=()=>setCase("low");
$("clear").onclick=clearInk;
$("closePad").onclick=()=>{ $("pad").classList.remove("on"); renderBoard(); };
window.addEventListener("resize",()=>{
  if(!$("pad").classList.contains("on")) return;
  fitCanvas(guide,gctx); fitCanvas(ink,ictx); drawGuide(); clearInk();
});
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if($("pad").classList.contains("on")) drawGuide(); });

/* ---- shape check ---- */
const N=120;
function maskOf(src){
  const c=document.createElement("canvas"); c.width=N; c.height=N;
  c.getContext("2d").drawImage(src,0,0,N,N);
  const d=c.getContext("2d").getImageData(0,0,N,N).data, m=new Uint8Array(N*N);
  for(let i=0;i<N*N;i++) m[i]=d[i*4+3]>40?1:0;
  return m;
}
function targetMask(){
  const c=document.createElement("canvas"); c.width=N; c.height=N;
  const x=c.getContext("2d"); drawLetterOn(x,N,"#000");
  const d=x.getImageData(0,0,N,N).data, m=new Uint8Array(N*N);
  for(let i=0;i<N*N;i++) m[i]=d[i*4+3]>40?1:0;
  return m;
}
function dilate(m,r){
  const a=new Uint8Array(N*N), b=new Uint8Array(N*N);
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){ let v=0;
    for(let dx=-r;dx<=r;dx++){ const nx=x+dx; if(nx<0||nx>=N) continue; if(m[y*N+nx]){v=1;break;} } a[y*N+x]=v; }
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){ let v=0;
    for(let dy=-r;dy<=r;dy++){ const ny=y+dy; if(ny<0||ny>=N) continue; if(a[ny*N+x]){v=1;break;} } b[y*N+x]=v; }
  return b;
}
const cnt=m=>{let c=0;for(let i=0;i<m.length;i++)c+=m[i];return c;};
const inter=(a,b)=>{let c=0;for(let i=0;i<a.length;i++) if(a[i]&&b[i])c++; return c;};

/* ספי הבדיקה. R_COV קטן מ-R_PREC כי כדי "לכסות" את האות צריך לעבור
   ממש עליה, ואילו לחריגה קטנה מהקו מותר להיות סלחנית יותר. */
const R_COV=5, R_PREC=4;
/* MAX_INK נקבע ממדידה: מעבר תקין על כל 26 האותיות בשתי הצורות הגיע
   ל-0.64 לכל היותר, ומעבר "מושלם" שממלא את האות בדיוק מגיע ל-0.99.
   מילוי השטח של אות צפופה כמו e מגיע ל-1.43, ולכן הסף באמצע. */
const MIN_COVER=.80, MIN_CELLS=.85, MIN_PREC=.85, MAX_INK=1.15, MAX_OVERDRAW=3.2;

/* חפיפת פיקסלים לבדה ניתנת לרמייה: שני קווים אלכסוניים שמנופחים
   ברדיוס נדיב "נוגעים" בחלק גדול מאות צפופה. לכן בודקים גם לפי תאים –
   מחלקים את האות לריבועים וסופרים בכמה מהם המשתמש באמת עבר. כך
   חייבים לבקר בכל חלק של האות ולא רק לחתוך אותה. */
const CELL=10;
function cellCoverage(user,tgt){
  const uD=dilate(user,2), g=Math.ceil(N/CELL);
  let need=0, got=0;
  for(let cy=0;cy<g;cy++) for(let cx=0;cx<g;cx++){
    let t=0,u=0;
    const yEnd=Math.min(N,(cy+1)*CELL), xEnd=Math.min(N,(cx+1)*CELL);
    for(let y=cy*CELL;y<yEnd;y++) for(let x=cx*CELL;x<xEnd;x++){
      const i=y*N+x; if(tgt[i]){ t++; if(uD[i]) u++; }
    }
    if(t>=6){ need++; if(u>=Math.max(2,t*.25)) got++; }
  }
  return need?got/need:0;
}

function judgeWriting(){
  const user=maskOf(ink), nUser=cnt(user);
  if(nUser<120||strokes===0) return {empty:true};
  const tgt=targetMask(), nTgt=Math.max(1,cnt(tgt));
  const coverage=inter(tgt,dilate(user,R_COV))/nTgt;
  const cells=cellCoverage(user,tgt);
  const precision=inter(user,dilate(tgt,R_PREC))/nUser;
  /* כמה דיו נצבע ביחס לגודל האות. מעבר נקי בעט דק מגיע ל-0.4-1.0,
     ומילוי השטח בקישקוש עובר את 1.5. */
  const inkRatio=nUser/nTgt;
  /* מסלול ארוך בהרבה מהשטח שנצבע = חזרות הלוך-חזור על אותו מקום. */
  const areaS=nUser*(S/N)*(S/N);
  const overdraw=travel/Math.max(1,areaS/PEN);
  const score=Math.round(Math.min(coverage,1)*30+Math.min(cells,1)*30+Math.min(precision,1)*40);
  const scribble=inkRatio>MAX_INK||overdraw>MAX_OVERDRAW;
  const pass=coverage>=MIN_COVER&&cells>=MIN_CELLS&&precision>=MIN_PREC&&!scribble;
  return {coverage,cells,precision,inkRatio,overdraw,score,scribble,pass};
}

$("check").onclick=()=>{
  const r=judgeWriting();
  if(r.empty){
    $("result").textContent="עדיין לא כתבתם כלום. עוברים עם האצבע על האות האפורה.";
    $("bar").style.width="0%"; return;
  }
  $("bar").style.width=Math.min(100,r.score)+"%";
  const key=padLetter.u;
  if(r.pass){
    mastered[key]=Object.assign({},mastered[key],{[padCase]:true}); saveProgress();
    const m=mastered[key]; tone([660,880,1046]); buzz(60);
    $("bar").style.background="var(--leaf)";
    $("result").textContent="מעולה! כתבת את "+targetChar()+" נכון ("+r.score+"%). "+
      (m.up&&m.low?"סיימת את שתי הצורות! 🏆":"עכשיו נסה את הצורה השנייה.");
    return;
  }
  tone([420,360]); buzz(25); $("bar").style.background="var(--sun)";
  if(r.scribble){
    $("bar").style.background="var(--tangerine)";
    $("result").textContent="זה נראה כמו קישקוש ולא כמו אות. עוברים על הקו האפור פעם אחת, בלי למלא את כל השטח.";
  }else if(r.coverage<MIN_COVER||r.cells<MIN_CELLS){
    $("result").textContent="כמעט ("+r.score+"%). חסר חלק מהאות – עברו על כל הקווים האפורים עד הסוף.";
  }else{
    $("result").textContent="כמעט ("+r.score+"%). הקו יצא החוצה – נסו להישאר בדיוק על האפור.";
  }
};

/* ---- games with scoring ---- */
(function(){
  const sheet=$("games");
  const views={menu:$("gmenu"),listen:$("gListen"),pairs:$("gPairs"),search:$("gSearch"),end:$("gEnd")};
  const BKEY="abc-best";
  const QN=10, PN=6, GRID=8, SW=5;
  let best={listen:0,pairs:0,search:0}, mode=null, score=0, roundMax=0;

  async function loadBest(){
    try{ const r=await window.storage.get(BKEY); if(r&&r.value) best=Object.assign(best,JSON.parse(r.value)); }
    catch(e){ try{ const v=localStorage.getItem(BKEY); if(v) best=Object.assign(best,JSON.parse(v)); }catch(e2){} }
    paintBest();
  }
  async function saveBest(){
    try{ await window.storage.set(BKEY,JSON.stringify(best)); }
    catch(e){ try{ localStorage.setItem(BKEY,JSON.stringify(best)); }catch(e2){} }
  }
  function paintBest(){
    $("bestListen").textContent=best.listen;
    $("bestPairs").textContent=best.pairs;
    $("bestSearch").textContent=best.search;
  }

  const shuffle=a=>{ a=a.slice();
    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; }
    return a; };
  const hush=()=>{ try{ speechSynthesis.cancel(); }catch(e){} };

  /* המשחקים מכסים את כל 26 האותיות. כל משחק שולף מחפיסה מעורבבת
     ולא באקראי, כך שסבבים רצופים ממשיכים לאותיות חדשות ולא חוזרים
     על אותן אותיות עד שכל האלפבית נגמר. */
  /* מילים לתפזורת: רק מילים באותיות בלבד ובאורך שנוח לילד למצוא */
  const WORDS=L.map(x=>x.w).filter(w=>/^[A-Za-z]{3,6}$/.test(w));
  const decks={listen:[],pairs:[],words:[]};
  function draw(key,n,src){
    const pool=src||L;
    const out=[];
    while(out.length<n){
      if(!decks[key].length){
        decks[key]=shuffle(pool);
        /* 26 לא מתחלק בגודל הסבב, ולכן סבב יכול להתחיל בסוף מחלק
           אחד ולהמשיך לתחילת הבא. בלי זה אותה אות עלולה להישלף
           פעמיים באותו סבב ולהופיע כשני אריחים זהים. */
        const id=x=>(x&&x.u)||x;
        const used=new Set(out.map(id));
        if(used.size) decks[key].sort((a,b)=>(used.has(id(a))?1:0)-(used.has(id(b))?1:0));
      }
      out.push(decks[key].shift());
    }
    return out;
  }
  const deckLeft=key=>decks[key].length;

  function show(v){
    for(const k in views) views[k].classList.toggle("on",k===v);
    $("scoreChip").hidden = (v==="menu"||v==="end");
  }
  function setScore(n){ score=Math.max(0,n); $("scoreNow").textContent=score; }

  function openMenu(){
    stopAbc();
    $("grange").textContent="כל 26 האותיות: A–Z";
    hush(); show("menu"); sheet.classList.add("on");
  }
  function closeGames(){ hush(); sheet.classList.remove("on"); }

  /* ---- game 1: listen and choose ---- */
  let qi=0,target=null,tries=0,roundQs=[];
  function startListen(){
    mode="listen"; setScore(0); qi=0; roundQs=draw("listen",QN); roundMax=QN*10;
    show("listen"); nextQ();
  }
  function nextQ(){
    if(qi>=QN) return endGame();
    tries=0; target=null;
    const t=roundQs[qi]; qi++;
    $("listenQ").textContent="שאלה "+qi+" מתוך "+QN;
    /* המסיחים נבחרים מכל האלפבית, לא רק מהחפיסה של הסבב */
    const others=shuffle(L.filter(x=>x.u!==t.u)).slice(0,3);
    const box=$("listenOpts"); box.innerHTML="";
    shuffle([t].concat(others)).forEach(o=>{
      const b=document.createElement("button");
      b.className="btn opt"; b.type="button"; b.textContent=o.u;
      b.setAttribute("aria-label","האות "+o.u);
      b.onclick=()=>answer(o,b);
      box.appendChild(b);
    });
    target=t;
    setTimeout(()=>{ if(target) speakLetter(target,.6); },350);
  }
  function answer(o,b){
    if(!target) return;
    if(o.u===target.u){
      b.classList.add("good"); tone([660,880]); buzz(40);
      setScore(score+(tries===0?10:5));
      target=null; setTimeout(nextQ,750);
    }else{
      tries++; b.classList.add("bad"); b.disabled=true; tone([300,220]); buzz([25,60,25]);
      const again=target; setTimeout(()=>{ if(target===again) speakLetter(again,.6); },420);
    }
  }

  /* ---- game 2: match upper to lower ---- */
  let firstPick=null,matched=0,misses=0,totalPairs=0;
  function startPairs(){
    mode="pairs"; setScore(0); matched=0; misses=0; firstPick=null; show("pairs");
    const p=draw("pairs",PN);
    totalPairs=p.length; roundMax=totalPairs*10;
    $("pairsQ").textContent="מתאימים "+totalPairs+" זוגות · עוד "+deckLeft("pairs")+" אותיות עד סוף האלפבית";
    const grid=$("pairsGrid"); grid.innerHTML="";
    const tiles=shuffle(p.map(l=>({l,c:"up"})).concat(p.map(l=>({l,c:"low"}))));
    tiles.forEach(t=>{
      const b=document.createElement("button");
      b.className="tile "+(t.c==="up"?"tup":"tlow"); b.type="button";
      b.textContent = t.c==="up" ? t.l.u : t.l.u.toLowerCase();
      b.setAttribute("aria-label",(t.c==="up"?"אות גדולה ":"אות קטנה ")+t.l.u);
      b.onclick=()=>pick(b,t);
      grid.appendChild(b);
    });
  }
  function pick(b,t){
    if(b.classList.contains("done")||b.classList.contains("sel")) return;
    speakLetter(t.l,.7);
    if(!firstPick){ firstPick={b,t}; b.classList.add("sel"); return; }
    const a=firstPick; firstPick=null; a.b.classList.remove("sel");
    if(a.t.l.u===t.l.u && a.t.c!==t.c){
      a.b.classList.add("done"); b.classList.add("done");
      a.b.disabled=true; b.disabled=true;
      tone([660,880]); buzz(40); matched++;
      setScore(matched*10-misses*2);
      if(matched===totalPairs) setTimeout(endGame,700);
    }else{
      misses++; setScore(matched*10-misses*2);
      a.b.classList.add("bad"); b.classList.add("bad"); tone([300,220]); buzz([25,60,25]);
      setTimeout(()=>{ a.b.classList.remove("bad"); b.classList.remove("bad"); },600);
    }
  }

  /* ---- game 3: word search ---- */
  let cells=[],placed=[],foundCount=0,searchMisses=0,dragFrom=null,dragCells=[];
  const AZ="ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  function buildGrid(words){
    /* null = משבצת ריקה שתתמלא באות אקראית בסוף */
    const g=[]; for(let i=0;i<GRID*GRID;i++) g.push(null);
    const put=[];
    for(const w of words){
      const W=w.toUpperCase();
      let ok=false;
      for(let attempt=0;attempt<300&&!ok;attempt++){
        const horiz=Math.random()<.5;
        const maxStart=GRID-W.length;
        if(maxStart<0) break;
        const r=Math.floor(Math.random()*(horiz?GRID:maxStart+1));
        const c=Math.floor(Math.random()*(horiz?maxStart+1:GRID));
        let fits=true;
        for(let i=0;i<W.length;i++){
          const rr=horiz?r:r+i, cc=horiz?c+i:c, cur=g[rr*GRID+cc];
          if(cur!==null&&cur!==W[i]){ fits=false; break; }
        }
        if(!fits) continue;
        const idx=[];
        for(let i=0;i<W.length;i++){
          const rr=horiz?r:r+i, cc=horiz?c+i:c;
          g[rr*GRID+cc]=W[i]; idx.push(rr*GRID+cc);
        }
        put.push({word:w,letters:W,idx}); ok=true;
      }
    }
    for(let i=0;i<g.length;i++) if(g[i]===null) g[i]=AZ[Math.floor(Math.random()*26)];
    return {grid:g,placed:put};
  }

  function paintWords(){
    const box=$("searchWords"); box.innerHTML="";
    placed.forEach(p=>{
      const s=document.createElement("span");
      s.className="wchip"+(p.done?" found":"");
      s.innerHTML='<span class="en">'+p.word+'</span>';
      box.appendChild(s);
    });
  }

  function startSearch(){
    mode="search"; setScore(0); foundCount=0; searchMisses=0; dragFrom=null; dragCells=[];
    show("search");
    const words=draw("words",SW,WORDS);
    const built=buildGrid(words);
    placed=built.placed; roundMax=placed.length*10;
    $("searchQ").textContent="מצאו "+placed.length+" מילים · מעבירים את האצבע מהאות הראשונה לאחרונה";
    const grid=$("searchGrid");
    grid.style.gridTemplateColumns="repeat("+GRID+",1fr)";
    grid.innerHTML=""; cells=[];
    built.grid.forEach((ch,i)=>{
      const d=document.createElement("div");
      d.className="cell"; d.textContent=ch; d.dataset.i=i;
      grid.appendChild(d); cells.push(d);
    });
    paintWords();
  }

  function cellAt(x,y){
    const el=document.elementFromPoint(x,y);
    return el&&el.classList&&el.classList.contains("cell")?el:null;
  }
  function lineBetween(a,b){
    const r1=Math.floor(a/GRID), c1=a%GRID, r2=Math.floor(b/GRID), c2=b%GRID;
    const out=[];
    if(r1===r2){ const s=Math.min(c1,c2), e=Math.max(c1,c2); for(let c=s;c<=e;c++) out.push(r1*GRID+c); }
    else if(c1===c2){ const s=Math.min(r1,r2), e=Math.max(r1,r2); for(let r=s;r<=e;r++) out.push(r*GRID+c1); }
    return out; /* ריק אם לא באותה שורה או עמודה */
  }
  function paintSel(idx){
    cells.forEach(c=>c.classList.remove("sel"));
    idx.forEach(i=>cells[i].classList.add("sel"));
  }

  $("searchGrid").addEventListener("pointerdown",e=>{
    const el=cellAt(e.clientX,e.clientY); if(!el) return;
    e.preventDefault(); dragFrom=+el.dataset.i; dragCells=[dragFrom]; paintSel(dragCells);
  });
  $("searchGrid").addEventListener("pointermove",e=>{
    if(dragFrom===null) return;
    const el=cellAt(e.clientX,e.clientY); if(!el) return;
    const line=lineBetween(dragFrom,+el.dataset.i);
    if(line.length){ dragCells=line; paintSel(dragCells); }
  });
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>
    $("searchGrid").addEventListener(ev,()=>{
      if(dragFrom===null) return;
      const picked=dragCells.slice();
      dragFrom=null; dragCells=[];
      cells.forEach(c=>c.classList.remove("sel"));
      if(picked.length<3) return;
      const text=picked.map(i=>cells[i].textContent).join("");
      const rev=text.split("").reverse().join("");
      const hit=placed.find(p=>!p.done&&(p.letters===text||p.letters===rev));
      if(hit){
        hit.done=true; foundCount++;
        hit.idx.forEach(i=>cells[i].classList.add("found"));
        paintWords(); tone([660,880]); buzz(40);
        speak(hit.word,.8);
        setScore(foundCount*10-searchMisses*2);
        if(foundCount===placed.length) setTimeout(endGame,900);
      }else{
        searchMisses++; setScore(foundCount*10-searchMisses*2);
        tone([300,220]); buzz([25,60,25]);
        picked.forEach(i=>cells[i].classList.add("bad"));
        setTimeout(()=>picked.forEach(i=>cells[i].classList.remove("bad")),450);
      }
    }));

  /* ---- end of round ---- */
  function endGame(){
    hush();
    const pct = roundMax ? Math.round(score/roundMax*100) : 0;
    const st = pct>=90?3:pct>=70?2:pct>=40?1:0;
    $("endStars").textContent = st ? "⭐".repeat(st) : "🙂";
    $("endScore").textContent = score;
    let msg = st===3 ? "מושלם! כל הכבוד 🎉"
            : st===2 ? "יפה מאוד! עוד קצת ואתה שם"
            : st===1 ? "כל הכבוד שניסית! בוא ננסה עוד פעם"
            : "לא נורא — בכל פעם לומדים עוד קצת";
    if(score>best[mode]){ best[mode]=score; saveBest(); paintBest(); msg="🏆 שיא חדש! "+msg; }
    $("endMsg").textContent=msg;
    show("end");
    if(st>=2) tone([523,659,784]);
  }

  $("gamesOpen").onclick=openMenu;
  $("gamesClose").onclick=closeGames;
  $("playListen").onclick=startListen;
  $("playPairs").onclick=startPairs;
  $("playSearch").onclick=startSearch;
  $("speakerBtn").onclick=()=>{ if(target) speakLetter(target,.6); };
  $("playAgain").onclick=()=>{
    mode==="listen"?startListen():mode==="pairs"?startPairs():startSearch();
  };
  $("backMenu").onclick=openMenu;
  loadBest();
})();

renderSteps(); loadProgress();

/* ---- install to home screen ---- */
(function(){
  const banner=$("install"), btn=$("installBtn"), x=$("installX"), txt=$("installText");
  const help=$("help"), list=$("helpList"), ok=$("helpOk");
  const DIS="abc-install-dismissed";
  let deferred=null;

  const installed=()=>window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  const ua=navigator.userAgent;
  const isIOS=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  /* דפדפן פנימי של וואטסאפ/פייסבוק/אינסטגרם – אין בו התקנה */
  const inApp=/FBAN|FBAV|Instagram|Line\/|wv\)/i.test(ua);
  const dismissed=()=>{ try{ return localStorage.getItem(DIS)==="1"; }catch(e){ return false; } };

  if(installed()||dismissed()) return;

  const show=t=>{ if(t) txt.textContent=t; banner.classList.add("on"); };
  const hide=()=>banner.classList.remove("on");

  window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferred=e; show(); });
  window.addEventListener("appinstalled",()=>{ deferred=null; hide(); });

  if(inApp) show("פתחו את הדף בכרום כדי להתקין");
  /* גם בלי התמיכה של כרום הכפתור יופיע – ואז הוא מסביר איך לעשות זאת ידנית */
  setTimeout(()=>{ if(!installed()&&!dismissed()) show(); },1200);

  btn.addEventListener("click",async()=>{
    if(deferred){
      deferred.prompt();
      const r=await deferred.userChoice.catch(()=>null);
      deferred=null;
      if(r&&r.outcome==="accepted") hide();
      return;
    }
    list.innerHTML = isIOS
      ? "<li>לוחצים על כפתור השיתוף <b>⬆︎</b> שלמטה</li><li>גוללים ובוחרים <b>הוסף למסך הבית</b></li><li>לוחצים <b>הוסף</b></li>"
      : inApp
      ? "<li>פותחים את התפריט <b>⋮</b> שלמעלה</li><li>בוחרים <b>פתח בכרום</b></li><li>שם: <b>⋮</b> ואז <b>התקן אפליקציה</b></li>"
      : "<li>פותחים את תפריט הדפדפן <b>⋮</b></li><li>בוחרים <b>התקן אפליקציה</b> או <b>הוסף למסך הבית</b></li>";
    help.classList.add("on");
  });

  x.addEventListener("click",()=>{ hide(); try{ localStorage.setItem(DIS,"1"); }catch(e){} });
  ok.addEventListener("click",()=>help.classList.remove("on"));
  help.addEventListener("click",e=>{ if(e.target===help) help.classList.remove("on"); });
})();

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
