<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#CFE9F5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Eitan English">
<title>Eitan Learns English</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;800&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#152647; --sky:#CFE9F5; --sky-deep:#A9D6EA; --card:#FFFFFF;
    --tangerine:#FF7A45; --grape:#6C4BD1; --leaf:#20B278; --sun:#FFC93C;
    --sh:5px 5px 0 var(--ink); --sh-sm:3px 3px 0 var(--ink);
    --display:'Baloo 2','Rubik',system-ui,sans-serif;
    --body:'Rubik',system-ui,sans-serif;
    --letterface:'Andika','Trebuchet MS',system-ui,sans-serif;
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{overscroll-behavior:none}
  body{
    margin:0;font-family:var(--body);color:var(--ink);
    padding:calc(10px + var(--safe-t)) 10px calc(150px + var(--safe-b));
    background:var(--sky);
    background-image:radial-gradient(var(--sky-deep) 2px,transparent 2px);
    background-size:24px 24px;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  button{font-family:inherit;touch-action:manipulation}
  .wrap{max-width:860px;margin:0 auto}

  header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .logo{font-family:var(--display);font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
  .logo b{font-family:var(--letterface);font-weight:700;background:var(--sun);border:3px solid var(--ink);
    border-radius:10px;padding:0 8px;box-shadow:var(--sh-sm);transform:rotate(-4deg);display:inline-block;letter-spacing:1px}
  .steps{display:flex;gap:5px}
  .dot{width:11px;height:11px;border-radius:50%;background:var(--card);border:3px solid var(--ink);padding:0;cursor:pointer}
  .dot.done{background:var(--leaf)}
  .dot[aria-current="true"]{background:var(--grape);transform:scale(1.3)}

  /* ---- board: always 4 letters, 2×2 on phone ---- */
  .board{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .letter{
    background:var(--card);border:4px solid var(--ink);border-radius:20px;box-shadow:var(--sh);
    padding:10px 8px;text-align:center;position:relative;overflow:hidden;
  }
  .letter::after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:var(--sky);inset:auto -38px -48px auto}
  .letter>*{position:relative;z-index:1}
  .badge{position:absolute;top:6px;inset-inline-start:6px;z-index:2;font-family:var(--display);font-size:11px;
    background:var(--leaf);color:#fff;border:2px solid var(--ink);border-radius:999px;padding:1px 7px;display:none}
  .letter.mastered .badge{display:block}
  .letter.half .badge{display:block;background:var(--sun);color:var(--ink)}
  .pair{display:flex;align-items:baseline;justify-content:center;gap:8px;line-height:.95}
  .up{font-family:var(--letterface);font-weight:700;font-size:clamp(44px,13vw,72px)}
  .low{font-family:var(--letterface);font-weight:400;font-size:clamp(32px,9.5vw,52px);color:var(--tangerine)}
  .tip{font-family:var(--display);font-size:14px;margin:2px 0 8px}
  .tip span{background:var(--sun);border:2px solid var(--ink);border-radius:7px;padding:0 8px}

  .btn{font-family:var(--display);font-weight:600;cursor:pointer;color:var(--ink);
    border:3px solid var(--ink);border-radius:13px;background:var(--card);box-shadow:var(--sh-sm);
    transition:transform .07s ease,box-shadow .07s ease}
  .btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
  .btn:focus-visible,.dot:focus-visible{outline:4px solid var(--grape);outline-offset:3px}
  .hear{width:100%;min-height:48px;font-size:16px;background:var(--leaf);color:#fff}
  .write{width:100%;min-height:46px;margin-top:6px;font-size:16px;background:var(--grape);color:#fff}
  .word{width:100%;min-height:38px;margin-top:6px;font-size:13px;background:var(--sky)}
  .word .en{font-family:var(--letterface);font-weight:700}
  .letter.speaking{background:#FFF6D9}
  .letter.hit{background:#DFF6EC}
  .letter.miss{background:#FFE6DC}

  .status{font-family:var(--display);font-size:16px;text-align:center;min-height:22px;margin:10px 0 0}

  /* ---- sticky bottom bar ---- */
  .bar{
    position:fixed;inset-inline:0;bottom:0;z-index:20;
    padding:10px 10px calc(10px + var(--safe-b));
    background:linear-gradient(to top,var(--sky) 72%,rgba(207,233,245,0));
  }
  .bar-in{max-width:860px;margin:0 auto;display:grid;grid-template-columns:56px 1fr 1fr 56px;gap:8px}
  .bar .btn{min-height:52px;font-size:15px;padding:0 6px}
  .arrow{font-size:22px;background:var(--card)}
  .all{background:var(--sun)}
  .quiz{background:var(--grape);color:#fff}

  /* ---- writing pad: fullscreen sheet ---- */
  .pad{position:fixed;inset:0;z-index:60;background:var(--sky);display:none;
    flex-direction:column;padding:calc(8px + var(--safe-t)) 10px calc(8px + var(--safe-b));overscroll-behavior:contain}
  .pad.on{display:flex}
  .pad-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .pad-top h2{font-family:var(--display);font-size:17px;margin:0}
  .close{width:44px;height:44px;border-radius:50%;font-size:20px;background:var(--card)}
  .case{display:inline-flex;background:var(--card);border:3px solid var(--ink);border-radius:999px;padding:3px;margin:8px auto;box-shadow:var(--sh-sm)}
  .case button{font-family:var(--letterface);font-weight:700;font-size:17px;border:0;background:transparent;color:var(--ink);
    min-height:40px;padding:0 18px;border-radius:999px;cursor:pointer}
  .case button[aria-pressed="true"]{background:var(--grape);color:#fff}
  .sheet{position:relative;width:min(94vw,52vh);aspect-ratio:1/1;margin:0 auto;flex:0 0 auto}
  .sheet canvas{position:absolute;inset:0;width:100%;height:100%;border:3px solid var(--ink);border-radius:16px;display:block}
  #guide{background:#FFFDF6}
  #ink{touch-action:none;background:transparent}
  .meter{width:min(94vw,52vh);height:12px;margin:10px auto 0;background:var(--card);border:3px solid var(--ink);border-radius:999px;overflow:hidden}
  .meter i{display:block;height:100%;width:0;background:var(--leaf);transition:width .35s ease}
  .result{font-family:var(--display);font-size:15px;line-height:1.35;text-align:center;margin:10px auto 0;max-width:420px;flex:1 1 auto}
  .padbtns{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;max-width:420px;margin:0 auto;width:100%}
  .padbtns .btn{min-height:56px;font-size:18px}
  .check{background:var(--leaf);color:#fff}
  .clear{background:var(--sun)}

  /* ---- install to home screen ---- */
  .install{display:none;align-items:center;gap:8px;margin-bottom:10px;padding:8px 10px;
    background:var(--sun);border:3px solid var(--ink);border-radius:14px;box-shadow:var(--sh-sm)}
  .install.on{display:flex}
  .install p{margin:0;flex:1 1 auto;font-family:var(--display);font-size:14px;line-height:1.25}
  .install .go{flex:0 0 auto;min-height:42px;padding:0 14px;font-size:14px;background:var(--leaf);color:#fff}
  .install .x{flex:0 0 auto;width:36px;min-height:36px;padding:0;font-size:15px;background:var(--card);border-radius:50%}

  .help{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
    padding:16px;background:rgba(21,38,71,.55)}
  .help.on{display:flex}
  .help-box{width:100%;max-width:380px;padding:16px;font-family:var(--display);
    background:var(--card);border:4px solid var(--ink);border-radius:20px;box-shadow:var(--sh)}
  .help-box h3{margin:0 0 10px;font-size:18px}
  .help-box ol{margin:0 0 14px;padding-inline-start:22px;font-size:15px;line-height:1.75}
  .help-box .btn{width:100%;min-height:48px;font-size:16px;background:var(--grape);color:#fff}

  @media (min-width:720px){
    .board{grid-template-columns:repeat(4,1fr)}
    .bar-in{grid-template-columns:64px 1fr 1fr 64px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><b>Aa</b> Eitan Learns English</div>
    <div class="steps" id="steps" role="group" aria-label="קבוצות אותיות"></div>
  </header>

  <div class="install" id="install">
    <p id="installText">רוצים את האפליקציה על מסך הבית?</p>
    <button class="btn go" id="installBtn">📲 התקנה</button>
    <button class="btn x" id="installX" aria-label="לא עכשיו">✕</button>
  </div>

  <main class="board" id="board"></main>
  <p class="status" id="status"></p>
</div>

<nav class="bar">
  <div class="bar-in">
    <button class="btn arrow" id="prev" aria-label="הקודמות">→</button>
    <button class="btn all" id="all">🔊 כל הארבע</button>
    <button class="btn quiz" id="quiz">🎧 מה שמעתם?</button>
    <button class="btn arrow" id="next" aria-label="הבאות">←</button>
  </div>
</nav>

<section class="pad" id="pad" aria-modal="true" role="dialog">
  <div class="pad-top">
    <h2 id="padTitle">כתיבת האות</h2>
    <button class="btn close" id="closePad" aria-label="סגירה">✕</button>
  </div>
  <div class="case" role="group" aria-label="גודל האות">
    <button id="caseUp" aria-pressed="true">A גדולה</button>
    <button id="caseLow" aria-pressed="false">a קטנה</button>
  </div>
  <div class="sheet">
    <canvas id="guide"></canvas>
    <canvas id="ink" aria-label="שטח כתיבה"></canvas>
  </div>
  <div class="meter"><i id="bar"></i></div>
  <p class="result" id="result">עוברים עם האצבע על האות האפורה, ואז לוחצים "בדקו אותי".</p>
  <div class="padbtns">
    <button class="btn clear" id="clear">🧽 מוחקים</button>
    <button class="btn check" id="check">✅ בדקו אותי</button>
  </div>
</section>

<section class="help" id="help" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
  <div class="help-box">
    <h3 id="helpTitle">להוספת האפליקציה למסך הבית</h3>
    <ol id="helpList"></ol>
    <button class="btn" id="helpOk">הבנתי</button>
  </div>
</section>

<script>
const L=[
  {u:"A",say:"איי",w:"Apple",he:"תפוח",e:"🍎"},{u:"B",say:"בּי",w:"Ball",he:"כדור",e:"⚽"},
  {u:"C",say:"סי",w:"Cat",he:"חתול",e:"🐱"},{u:"D",say:"די",w:"Dog",he:"כלב",e:"🐶"},
  {u:"E",say:"אי",w:"Egg",he:"ביצה",e:"🥚"},{u:"F",say:"אֶף",w:"Fish",he:"דג",e:"🐟"},
  {u:"G",say:"ג'י",w:"Giraffe",he:"ג'ירפה",e:"🦒"},{u:"H",say:"אייץ'",w:"House",he:"בית",e:"🏠"},
  {u:"I",say:"איי",w:"Ice cream",he:"גלידה",e:"🍦"},{u:"J",say:"ג'יי",w:"Juice",he:"מיץ",e:"🧃"},
  {u:"K",say:"קיי",w:"Key",he:"מפתח",e:"🔑"},{u:"L",say:"אֶל",w:"Lion",he:"אריה",e:"🦁"},
  {u:"M",say:"אֶם",w:"Moon",he:"ירח",e:"🌙"},{u:"N",say:"אֶן",w:"Nose",he:"אף",e:"👃"},
  {u:"O",say:"או",w:"Orange",he:"תפוז",e:"🍊"},{u:"P",say:"פּי",w:"Pizza",he:"פיצה",e:"🍕"},
  {u:"Q",say:"קיוּ",w:"Queen",he:"מלכה",e:"👑"},{u:"R",say:"אָר",w:"Rainbow",he:"קשת",e:"🌈"},
  {u:"S",say:"אֶס",w:"Sun",he:"שמש",e:"☀️"},{u:"T",say:"טי",w:"Tree",he:"עץ",e:"🌳"},
  {u:"U",say:"יוּ",w:"Umbrella",he:"מטרייה",e:"☂️"},{u:"V",say:"וי",w:"Violin",he:"כינור",e:"🎻"},
  {u:"W",say:"דאבּל-יוּ",w:"Watch",he:"שעון",e:"⌚"},{u:"X",say:"אֶקס",w:"Fox",he:"שועל",e:"🦊"},
  {u:"Y",say:"וואי",w:"Yo-yo",he:"יו-יו",e:"🪀"},{u:"Z",say:"זי",w:"Zebra",he:"זברה",e:"🦓"}
];
const groups=[]; for(let i=0;i<L.length;i+=4) groups.push(L.slice(i,i+4));
const $=id=>document.getElementById(id);
let g=0,quizAnswer=null,visited=new Set([0]),mastered={},padLetter=null,padCase="up";
const buzz=ms=>{ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };

/* ---- progress ---- */
const KEY="abc-writing";
async function loadProgress(){
  try{ const r=await window.storage.get(KEY); if(r&&r.value) mastered=JSON.parse(r.value); }
  catch(e){ try{ const v=localStorage.getItem(KEY); if(v) mastered=JSON.parse(v); }catch(e2){} }
  renderBoard();
}
async function saveProgress(){
  try{ await window.storage.set(KEY,JSON.stringify(mastered)); }
  catch(e){ try{ localStorage.setItem(KEY,JSON.stringify(mastered)); }catch(e2){} }
}

/* ---- speech (iOS needs one tap to unlock) ---- */
let voice=null,unlocked=false;
function pickVoice(){
  const v=speechSynthesis.getVoices().filter(x=>x.lang&&x.lang.toLowerCase().startsWith("en"));
  voice=v.find(x=>/samantha|zira|karen|google us|female/i.test(x.name))||v[0]||null;
}
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
document.addEventListener("pointerdown",()=>{
  if(unlocked||!("speechSynthesis" in window)) return;
  unlocked=true; const u=new SpeechSynthesisUtterance(" "); u.volume=0; speechSynthesis.speak(u); pickVoice();
},{once:true});
function speak(t,rate,onend){
  if(!("speechSynthesis" in window)){ if(onend) onend(); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);
  u.lang="en-US"; u.rate=rate||.7; u.pitch=1.05; if(voice) u.voice=voice; if(onend) u.onend=onend;
  speechSynthesis.speak(u);
}
let ac;
function tone(fs){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended") ac.resume();
    fs.forEach((f,i)=>{
      const o=ac.createOscillator(),gn=ac.createGain();
      o.type="triangle";o.frequency.value=f;o.connect(gn);gn.connect(ac.destination);
      const t=ac.currentTime+i*.12;
      gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(.14,t+.02);
      gn.gain.exponentialRampToValueAtTime(.0001,t+.22);
      o.start(t);o.stop(t+.24);
    });
  }catch(e){}
}

/* ---- board ---- */
function renderSteps(){
  const s=$("steps"); s.innerHTML="";
  groups.forEach((grp,i)=>{
    const b=document.createElement("button");
    b.className="dot"+(visited.has(i)?" done":""); b.type="button";
    b.setAttribute("aria-label","קבוצה "+(i+1)+": "+grp.map(x=>x.u).join(" "));
    b.setAttribute("aria-current",i===g?"true":"false");
    b.onclick=()=>go(i); s.appendChild(b);
  });
}
function renderBoard(){
  const b=$("board"); b.innerHTML="";
  groups[g].forEach(l=>{
    const m=mastered[l.u]||{};
    const card=document.createElement("div");
    card.className="letter"+(m.up&&m.low?" mastered":(m.up||m.low?" half":""));
    card.innerHTML='<span class="badge">'+(m.up&&m.low?"✓ יודע":(m.up?"✓ A":"✓ a"))+'</span>'+
      '<div class="pair"><span class="up">'+l.u+'</span><span class="low">'+l.u.toLowerCase()+'</span></div>'+
      '<div class="tip">אומרים: <span>'+l.say+'</span></div>';
    const hear=document.createElement("button");
    hear.className="btn hear"; hear.type="button"; hear.innerHTML="🔊 האות";
    hear.onclick=()=>{ quizAnswer?checkQuiz(l,card):(flash(card),speak(l.u,.65)); };
    card.appendChild(hear);
    const wr=document.createElement("button");
    wr.className="btn write"; wr.type="button"; wr.innerHTML="✍️ לכתוב";
    wr.onclick=()=>openPad(l); card.appendChild(wr);
    const wd=document.createElement("button");
    wd.className="btn word"; wd.type="button";
    wd.innerHTML=l.e+' <span class="en">'+l.w+'</span>';
    wd.onclick=()=>{ flash(card); speak(l.w,.8); }; card.appendChild(wd);
    b.appendChild(card);
  });
}
function flash(card){
  document.querySelectorAll(".letter").forEach(c=>c.classList.remove("speaking","hit","miss"));
  card.classList.add("speaking"); setTimeout(()=>card.classList.remove("speaking"),900);
}
function go(i){
  g=(i+groups.length)%groups.length; visited.add(g); quizAnswer=null;
  $("status").textContent=""; $("quiz").textContent="🎧 מה שמעתם?";
  renderSteps(); renderBoard();
}
$("all").onclick=()=>{
  quizAnswer=null; $("status").textContent="";
  const cards=[...document.querySelectorAll(".letter")]; let i=0;
  (function nx(){
    if(i>=groups[g].length){ cards.forEach(c=>c.classList.remove("speaking")); return; }
    const l=groups[g][i],card=cards[i]; i++;
    cards.forEach(c=>c.classList.remove("speaking")); card.classList.add("speaking");
    speak(l.u,.6,()=>setTimeout(nx,450));
  })();
};
$("quiz").onclick=()=>{
  quizAnswer=groups[g][Math.floor(Math.random()*groups[g].length)];
  document.querySelectorAll(".letter").forEach(c=>c.classList.remove("hit","miss","speaking"));
  $("status").textContent="הקשיבו ולחצו על הכפתור הירוק הנכון";
  $("quiz").textContent="🔁 שוב";
  setTimeout(()=>speak(quizAnswer.u,.6),250);
};
function checkQuiz(l,card){
  if(l.u===quizAnswer.u){
    card.classList.add("hit"); tone([660,880]); buzz(40);
    $("status").textContent="נכון! זאת "+l.u+" – "+l.w;
    quizAnswer=null; $("quiz").textContent="🎧 עוד אחת";
  }else{
    card.classList.add("miss"); tone([300,220]); buzz([25,60,25]);
    $("status").textContent="לא זאת. הקשיבו שוב";
    setTimeout(()=>{ card.classList.remove("miss"); speak(quizAnswer.u,.6); },900);
  }
}
$("next").onclick=()=>go(g+1);
$("prev").onclick=()=>go(g-1);
document.addEventListener("keydown",e=>{
  if($("pad").classList.contains("on")) return;
  if(e.key==="ArrowLeft") go(g+1);
  if(e.key==="ArrowRight") go(g-1);
});
/* swipe between groups */
let sx=0,sy=0;
document.addEventListener("touchstart",e=>{ sx=e.touches[0].clientX; sy=e.touches[0].clientY; },{passive:true});
document.addEventListener("touchend",e=>{
  if($("pad").classList.contains("on")) return;
  const dx=e.changedTouches[0].clientX-sx, dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>70 && Math.abs(dx)>Math.abs(dy)*2) go(dx<0?g+1:g-1);
},{passive:true});

/* ---- writing pad ---- */
const S=360, FONT='700 250px Andika,"Trebuchet MS",system-ui,sans-serif';
const guide=$("guide"), ink=$("ink");
const gctx=guide.getContext("2d"), ictx=ink.getContext("2d");
let drawing=false, strokes=0;

function fitCanvas(c,ctx){
  const r=c.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,3);
  c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr);
  const k=c.width/S; ctx.setTransform(k,0,0,k,0,0);
}
function targetChar(){ return padCase==="up"?padLetter.u:padLetter.u.toLowerCase(); }
function drawLetterOn(ctx,size,style){
  ctx.save(); ctx.scale(size/S,size/S);
  ctx.font=FONT; ctx.textAlign="center"; ctx.textBaseline="alphabetic";
  ctx.fillStyle=style||"#000"; ctx.fillText(targetChar(),S/2,S*0.78);
  ctx.restore();
}
function drawGuide(){
  if(!padLetter) return;
  gctx.clearRect(0,0,S,S);
  gctx.fillStyle="#FFFDF6"; gctx.fillRect(0,0,S,S);
  const top=S*.20, mid=S*.49, base=S*.78;
  gctx.strokeStyle="#9FC7DC"; gctx.lineWidth=2;
  [top,base].forEach(y=>{ gctx.beginPath(); gctx.moveTo(14,y); gctx.lineTo(S-14,y); gctx.stroke(); });
  gctx.setLineDash([8,8]); gctx.strokeStyle="#C9DFEB";
  gctx.beginPath(); gctx.moveTo(14,mid); gctx.lineTo(S-14,mid); gctx.stroke(); gctx.setLineDash([]);
  drawLetterOn(gctx,S,"#D9DEE8");
}
function clearInk(){
  ictx.clearRect(0,0,S,S); strokes=0;
  $("bar").style.width="0%"; $("bar").style.background="var(--leaf)";
  $("result").textContent='עוברים עם האצבע על האות האפורה, ואז לוחצים "בדקו אותי".';
}
function pos(e){
  const r=ink.getBoundingClientRect();
  return {x:(e.clientX-r.left)*S/r.width, y:(e.clientY-r.top)*S/r.height};
}
ink.addEventListener("pointerdown",e=>{
  e.preventDefault(); drawing=true; strokes++; ink.setPointerCapture(e.pointerId);
  const p=pos(e);
  ictx.strokeStyle="#152647"; ictx.lineWidth=17; ictx.lineCap="round"; ictx.lineJoin="round";
  ictx.beginPath(); ictx.moveTo(p.x,p.y); ictx.lineTo(p.x+.1,p.y); ictx.stroke();
});
ink.addEventListener("pointermove",e=>{ if(!drawing) return; e.preventDefault(); const p=pos(e); ictx.lineTo(p.x,p.y); ictx.stroke(); });
["pointerup","pointercancel","pointerleave"].forEach(ev=>ink.addEventListener(ev,()=>drawing=false));

function openPad(l){
  padLetter=l; padCase="up";
  $("caseUp").setAttribute("aria-pressed","true"); $("caseLow").setAttribute("aria-pressed","false");
  $("padTitle").textContent="כתיבת האות "+l.u+l.u.toLowerCase();
  $("pad").classList.add("on");
  requestAnimationFrame(()=>{ fitCanvas(guide,gctx); fitCanvas(ink,ictx); drawGuide(); clearInk(); });
  speak(l.u,.65);
}
function setCase(c){
  padCase=c;
  $("caseUp").setAttribute("aria-pressed",c==="up"); $("caseLow").setAttribute("aria-pressed",c==="low");
  drawGuide(); clearInk(); speak(padLetter.u,.65);
}
$("caseUp").onclick=()=>setCase("up");
$("caseLow").onclick=()=>setCase("low");
$("clear").onclick=clearInk;
$("closePad").onclick=()=>{ $("pad").classList.remove("on"); renderBoard(); };
window.addEventListener("resize",()=>{
  if(!$("pad").classList.contains("on")) return;
  fitCanvas(guide,gctx); fitCanvas(ink,ictx); drawGuide(); clearInk();
});
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ if($("pad").classList.contains("on")) drawGuide(); });

/* ---- shape check ---- */
const N=120;
function maskOf(src){
  const c=document.createElement("canvas"); c.width=N; c.height=N;
  c.getContext("2d").drawImage(src,0,0,N,N);
  const d=c.getContext("2d").getImageData(0,0,N,N).data, m=new Uint8Array(N*N);
  for(let i=0;i<N*N;i++) m[i]=d[i*4+3]>40?1:0;
  return m;
}
function targetMask(){
  const c=document.createElement("canvas"); c.width=N; c.height=N;
  const x=c.getContext("2d"); drawLetterOn(x,N,"#000");
  const d=x.getImageData(0,0,N,N).data, m=new Uint8Array(N*N);
  for(let i=0;i<N*N;i++) m[i]=d[i*4+3]>40?1:0;
  return m;
}
function dilate(m,r){
  const a=new Uint8Array(N*N), b=new Uint8Array(N*N);
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){ let v=0;
    for(let dx=-r;dx<=r;dx++){ const nx=x+dx; if(nx<0||nx>=N) continue; if(m[y*N+nx]){v=1;break;} } a[y*N+x]=v; }
  for(let y=0;y<N;y++) for(let x=0;x<N;x++){ let v=0;
    for(let dy=-r;dy<=r;dy++){ const ny=y+dy; if(ny<0||ny>=N) continue; if(a[ny*N+x]){v=1;break;} } b[y*N+x]=v; }
  return b;
}
const cnt=m=>{let c=0;for(let i=0;i<m.length;i++)c+=m[i];return c;};
const inter=(a,b)=>{let c=0;for(let i=0;i<a.length;i++) if(a[i]&&b[i])c++; return c;};

$("check").onclick=()=>{
  const user=maskOf(ink), nUser=cnt(user);
  if(nUser<120||strokes===0){
    $("result").textContent="עדיין לא כתבתם כלום. עוברים עם האצבע על האות האפורה.";
    $("bar").style.width="0%"; return;
  }
  const tgt=targetMask(), userD=dilate(user,7), tgtD=dilate(tgt,7);
  const coverage=inter(tgt,userD)/Math.max(1,cnt(tgt));
  const inside=inter(user,tgtD)/nUser;
  const score=Math.round(Math.min(coverage,1)*60+Math.min(inside,1)*40);
  $("bar").style.width=Math.min(100,score)+"%";
  const key=padLetter.u;
  if(coverage>=.75&&inside>=.7){
    mastered[key]=Object.assign({},mastered[key],{[padCase]:true}); saveProgress();
    const m=mastered[key]; tone([660,880,1046]); buzz(60);
    $("bar").style.background="var(--leaf)";
    $("result").textContent="מעולה! כתבת את "+targetChar()+" נכון ("+score+"%). "+
      (m.up&&m.low?"סיימת את שתי הצורות! 🏆":"עכשיו נסה את הצורה השנייה.");
  }else if(coverage<.6){
    tone([420,360]); buzz(25); $("bar").style.background="var(--sun)";
    $("result").textContent="כמעט ("+score+"%). חסר חלק מהאות – עברו על כל הקווים האפורים עד הסוף.";
  }else{
    tone([420,360]); buzz(25); $("bar").style.background="var(--sun)";
    $("result").textContent="כמעט ("+score+"%). הקו יצא החוצה – נסו להישאר בדיוק על האפור.";
  }
};

renderSteps(); loadProgress();

/* ---- install to home screen ---- */
(function(){
  const banner=$("install"), btn=$("installBtn"), x=$("installX"), txt=$("installText");
  const help=$("help"), list=$("helpList"), ok=$("helpOk");
  const DIS="abc-install-dismissed";
  let deferred=null;

  const installed=()=>window.matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
  const ua=navigator.userAgent;
  const isIOS=/iphone|ipad|ipod/i.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
  /* דפדפן פנימי של וואטסאפ/פייסבוק/אינסטגרם – אין בו התקנה */
  const inApp=/FBAN|FBAV|Instagram|Line\/|wv\)/i.test(ua);
  const dismissed=()=>{ try{ return localStorage.getItem(DIS)==="1"; }catch(e){ return false; } };

  if(installed()||dismissed()) return;

  const show=t=>{ if(t) txt.textContent=t; banner.classList.add("on"); };
  const hide=()=>banner.classList.remove("on");

  window.addEventListener("beforeinstallprompt",e=>{ e.preventDefault(); deferred=e; show(); });
  window.addEventListener("appinstalled",()=>{ deferred=null; hide(); });

  if(inApp) show("פתחו את הדף בכרום כדי להתקין");
  /* גם בלי התמיכה של כרום הכפתור יופיע – ואז הוא מסביר איך לעשות זאת ידנית */
  setTimeout(()=>{ if(!installed()&&!dismissed()) show(); },1200);

  btn.addEventListener("click",async()=>{
    if(deferred){
      deferred.prompt();
      const r=await deferred.userChoice.catch(()=>null);
      deferred=null;
      if(r&&r.outcome==="accepted") hide();
      return;
    }
    list.innerHTML = isIOS
      ? "<li>לוחצים על כפתור השיתוף <b>⬆︎</b> שלמטה</li><li>גוללים ובוחרים <b>הוסף למסך הבית</b></li><li>לוחצים <b>הוסף</b></li>"
      : inApp
      ? "<li>פותחים את התפריט <b>⋮</b> שלמעלה</li><li>בוחרים <b>פתח בכרום</b></li><li>שם: <b>⋮</b> ואז <b>התקן אפליקציה</b></li>"
      : "<li>פותחים את תפריט הדפדפן <b>⋮</b></li><li>בוחרים <b>התקן אפליקציה</b> או <b>הוסף למסך הבית</b></li>";
    help.classList.add("on");
  });

  x.addEventListener("click",()=>{ hide(); try{ localStorage.setItem(DIS,"1"); }catch(e){} });
  ok.addEventListener("click",()=>help.classList.remove("on"));
  help.addEventListener("click",e=>{ if(e.target===help) help.classList.remove("on"); });
})();

if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
